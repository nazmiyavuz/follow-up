<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>AJet Follow Up Times</title>
    <meta name="application-name" content="Follow Up" />
    <meta name="apple-mobile-web-app-title" content="Follow Up" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a84ff" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="icon"
      href="icons/favicon-32.png"
      sizes="32x32"
      type="image/png"
    />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css?v=20261007c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app container">
      <header class="banner">
        <span class="banner-text">AJet</span>
      </header>

      <main class="main">
        <div
          class="title-row d-flex align-items-center justify-content-between gap-2 mb-3"
        >
          <h1 class="title mb-0">
            AJet Follow Up <span class="title-en">/ Times</span>
          </h1>

          <div class="title-actions">
            <button
              type="button"
              class="btn info-btn"
              id="howToUseBtn"
              title="How to use this screen"
              aria-label="How to use this screen"
            >
              <span class="info-icon" aria-hidden="true">!</span>
            </button>
            <button
              type="button"
              class="btn theme-btn"
              id="themeBtn"
              title="Toggle theme"
              aria-label="Toggle dark/light theme"
              onclick="
                if (window.ajet && window.ajet.toggleTheme) {
                  window.ajet.toggleTheme();
                } else {
                  const t =
                    document.documentElement.getAttribute('data-theme') ===
                    'dark'
                      ? 'light'
                      : 'dark';
                  document.documentElement.setAttribute('data-theme', t);
                }
              "
            >
              <span class="theme-icon">🌙</span>
            </button>
          </div>
        </div>

        <div class="filters-row row g-2 g-md-3 mb-3">
          <div class="field-inline col-6 col-md">
            <label for="flightDate" class="form-label">Date</label>
            <input
              type="date"
              id="flightDate"
              class="input-date form-control"
              aria-label="Flight date"
            />
          </div>
          <div class="field-inline col-6 col-md">
            <label for="flightNumber" class="form-label">Flight number</label>
            <input
              type="text"
              id="flightNumber"
              class="input-flight form-control"
              placeholder="e.g. VF 123"
              aria-label="Flight number"
              autocomplete="off"
            />
          </div>
          <div class="col-12 col-sm-auto filters-action desktop-only">
            <button
              type="button"
              class="btn btn-secondary w-100"
              id="newFlightBtn"
              title="Clear times and start a new flight"
            >
              RESET FLIGHT
            </button>
          </div>
        </div>

        <div class="toolbar row g-2 mb-3">
          <div class="col-6 col-sm-auto actions">
            <button
              type="button"
              class="btn btn-primary w-100 w-sm-auto"
              id="newBtn"
              onclick="
                if (window.ajet && window.ajet.openModal) {
                  window.ajet.openModal();
                } else {
                  const m = document.getElementById('timeModal');
                  if (m && m.showModal) {
                    m.showModal();
                  }
                }
              "
            >
              NEW
            </button>
          </div>
          <div
            class="toolbar-divider d-none d-sm-block"
            aria-hidden="true"
          ></div>
          <div class="col-6 col-sm-auto actions">
            <button
              type="button"
              class="btn btn-secondary w-100 w-sm-auto"
              id="editBtn"
              onclick="
                if (window.ajet && window.ajet.openModalEdit) {
                  window.ajet.openModalEdit();
                } else {
                  alert('Please select a row first.');
                }
              "
            >
              EDIT
            </button>
          </div>
          <div
            class="toolbar-divider d-none d-sm-block"
            aria-hidden="true"
          ></div>
          <div class="col-12 col-sm actions">
            <div class="row g-2">
              <div class="col-6 col-sm-auto">
                <button
                  type="button"
                  class="btn btn-secondary w-100"
                  id="deleteBtn"
                  onclick="
                    if (window.ajet && window.ajet.deleteSelected) {
                      if (confirm('Delete selected row(s)?')) {
                        window.ajet.deleteSelected();
                      }
                    } else {
                      alert('Please select a row first.');
                    }
                  "
                >
                  DELETE
                </button>
              </div>
              <div class="col-6 col-sm-auto">
                <button
                  type="button"
                  class="btn btn-danger w-100"
                  id="deleteAllBtn"
                >
                  DELETE ALL
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="times-section">
          <div class="times-header mobile-only">
            <h2 class="times-header-title">Times</h2>
            <div class="times-header-actions">
              <button
                type="button"
                class="btn btn-whatsapp times-whatsapp-btn"
                id="copyWhatsAppBtn"
                onclick="
                  if (window.ajet && window.ajet.copyWhatsApp) {
                    window.ajet.copyWhatsApp();
                  } else {
                    alert('No times to copy.');
                  }
                "
              >
                COPY WHATSAPP
              </button>
              <div class="more-menu-wrap">
                <button
                  type="button"
                  class="btn more-btn"
                  id="moreBtn"
                  title="Edit or delete times"
                  aria-label="Edit or delete times"
                  aria-haspopup="menu"
                  aria-expanded="false"
                  aria-controls="actionsMenu"
                >
                  <span class="more-icon" aria-hidden="true">⋯</span>
                </button>
                <div class="actions-menu" id="actionsMenu" role="menu" hidden>
                  <button
                    type="button"
                    class="actions-menu-item"
                    id="menuEditBtn"
                    role="menuitem"
                  >
                    Edit selected
                  </button>
                  <button
                    type="button"
                    class="actions-menu-item"
                    id="menuDeleteBtn"
                    role="menuitem"
                  >
                    Delete selected
                  </button>
                  <button
                    type="button"
                    class="actions-menu-item actions-menu-item-danger"
                    id="menuDeleteAllBtn"
                    role="menuitem"
                  >
                    Delete all times
                  </button>
                  <button
                    type="button"
                    class="actions-menu-item"
                    id="menuResetFlightBtn"
                    role="menuitem"
                  >
                    Reset flight
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="times-list" id="timesList">
            <!-- Times rendered by JS -->
          </div>
        </div>

        <div class="extra-info mt-3">
          <label for="additionalInfo" class="form-label">
            Additional info
          </label>
          <textarea
            id="additionalInfo"
            class="form-control extra-info-input"
            placeholder="Add any extra explanation to include at the end of copied text"
            rows="3"
          ></textarea>
        </div>

        <p class="hint mt-1 mb-0" id="jsStatus" hidden>JS status: loading...</p>

        <div class="bottom-bar mt-4 pt-3 desktop-only">
          <button
            type="button"
            class="btn btn-whatsapp w-100"
            id="copyWhatsAppBtnDesktop"
            onclick="
              if (window.ajet && window.ajet.copyWhatsApp) {
                window.ajet.copyWhatsApp();
              } else {
                alert('No times to copy.');
              }
            "
          >
            COPY WHATSAPP
          </button>
        </div>
      </main>

      <button
        type="button"
        class="fab-new mobile-only"
        id="fabNewBtn"
        aria-label="New time"
      >
        + NEW
      </button>
    </div>

    <dialog class="modal" id="timeModal">
      <form class="modal-form" id="timeForm">
        <h2 class="modal-title">New time</h2>
        <div class="field">
          <span class="form-label" id="labelPickerLabel">Label</span>
          <div
            id="labelPicker"
            class="label-picker"
            role="radiogroup"
            aria-labelledby="labelPickerLabel"
          ></div>
          <input
            type="text"
            id="timeLabelCustom"
            class="custom-label-input hidden"
            hidden
            placeholder="Type custom label"
            aria-label="Custom label"
          />
        </div>
        <div class="field">
          <label for="timeValue">Time (UTC)</label>
          <input
            type="tel"
            id="timeValue"
            placeholder="HH:MM"
            pattern="[0-9]{1,2}:[0-9]{2}"
            inputmode="numeric"
            enterkeyhint="done"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            maxlength="5"
            required
          />
          <div class="utc-now-bar">
            <span class="utc-now-label">Current time (UTC):</span>
            <span class="utc-now-value" id="utcNowValue">--:--:--</span>
            <button
              type="button"
              class="btn btn-small btn-utc"
              id="setUtcNowBtn"
            >
              Set to now
            </button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="modalCancel">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <script src="app.js?v=20261007b"></script>
  </body>
</html>
